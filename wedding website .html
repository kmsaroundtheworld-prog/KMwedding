<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love at first dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF8F0; --ink:#2B2A26; --line:#2B2A2633;
  --olive:#5B7A43; --rose:#D68AA3; --wine:#7A2638; --on:#FBF8F0; --on-rose:#2A1D22;
  --serif:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
  --mono:"Courier Prime","Courier New",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cream:#1D221E;--ink:#EEE9DF;--line:#EEE9DF33}}
:root[data-theme="dark"]{--cream:#1D221E;--ink:#EEE9DF;--line:#EEE9DF33}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.8 var(--mono);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cream);z-index:40}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.1}
h2{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:.5em}
p{margin:0 0 1em}
a{color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.eyebrow{font-size:.8rem;letter-spacing:.08em;margin-bottom:1.2em}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--cream);border-bottom:1px solid var(--line)}
.nav{max-width:1280px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:32px}
.brand{font-family:var(--serif);font-size:1.45rem;text-decoration:none;white-space:nowrap}
.menu{display:flex;align-items:center;gap:28px;margin-left:auto;font-size:.88rem}
.menu a{text-decoration:none}
.menu a.l:hover{text-decoration:underline}
.lang button{font:inherit;font-size:.85rem;background:none;border:0;color:inherit;opacity:.55;cursor:pointer;padding:4px}
.lang button[aria-pressed="true"]{opacity:1;text-decoration:underline}
.btn{display:inline-block;font:400 .9rem var(--mono);background:none;color:inherit;border:1px solid currentColor;padding:12px 28px;text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--cream)}
.on-color .btn:hover{background:var(--on);color:var(--olive)}
.burger{display:none;margin-left:auto;background:none;border:0;width:40px;height:40px;cursor:pointer;color:inherit}
.burger i,.burger i::before,.burger i::after{display:block;width:22px;height:1.5px;background:currentColor;position:relative;margin:auto;content:""}
.burger i::before{position:absolute;top:-7px;left:0}.burger i::after{position:absolute;top:7px;left:0}
@media(max-width:860px){
  .nav{padding:10px 20px}
  .burger{display:block}
  .menu{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:flex-start;gap:20px;padding:28px 20px 32px;background:var(--cream);border-bottom:1px solid var(--line);margin:0;font-size:1rem}
  header.open .menu{display:flex}
}

.photo{background:linear-gradient(160deg,#9DB88A,#D8A9B6);background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;color:#fff;font-size:.8rem;width:100%}
.photo span{padding:14px;text-align:center;text-shadow:0 1px 3px #0006}
.photo.has-img span{display:none}
.hero-photo{height:min(78vh,720px)}

section{padding:clamp(64px,9vw,120px) 24px;text-align:center}
.wrap{max-width:1100px;margin:0 auto}
.narrow{max-width:560px;margin:0 auto}
.green{background:var(--olive);color:var(--on)}
.pink{background:var(--rose);color:var(--on-rose)}
.wine{background:var(--wine);color:var(--on)}
.green .btn,.wine .btn{color:var(--on)}
.hero-txt h1{font-size:clamp(2.8rem,8vw,6rem);font-style:italic;margin-bottom:.3em}

.pair{display:grid;grid-template-columns:1fr 2fr;gap:40px;align-items:center;margin-bottom:56px}
.pair .photo:first-child{aspect-ratio:3/4;max-width:280px;margin:0 auto}
.pair .photo:last-child{aspect-ratio:4/3}
@media(max-width:760px){.pair{grid-template-columns:1fr;gap:24px}}

.tl{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:40px 32px;text-align:left}
.tl li{border-top:1px solid currentColor;padding-top:16px}
.tl li:last-child{border-top-width:3px}
.tl .yr{font-family:var(--serif);font-size:2.6rem;line-height:1}
.tl h3{font-size:1.35rem;margin:.5em 0 .3em}
.tl p{font-size:.88rem;margin:0}

.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;text-align:left}
.split .photo{aspect-ratio:4/5}
.split h3{font-size:2.2rem;margin-bottom:.3em}
.split address{font-style:normal;opacity:.75;margin-bottom:1.4em}
@media(max-width:760px){.split{grid-template-columns:1fr;gap:28px}}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:80px;text-align:left}
.info>div{border-top:1px solid var(--line);padding-top:20px}
.info h3{font-size:1.6rem;margin-bottom:.5em}
.info p,.info li{font-size:.9rem}
.info ul{list-style:none;margin:0;padding:0}.info li{margin-bottom:.8em}
@media(max-width:860px){.info{grid-template-columns:1fr;gap:28px;margin-top:56px}}

.agenda{list-style:none;margin:40px auto 0;padding:0;max-width:600px;text-align:left}
.agenda li{display:grid;grid-template-columns:100px 1fr;gap:16px;padding:18px 0;border-top:1px solid #FBF8F055}
.agenda li:last-child{border-bottom:1px solid #FBF8F055}
.agenda time{font-family:var(--serif);font-size:1.7rem;line-height:1.2}
.agenda strong{display:block;font-weight:700}
.agenda span{font-size:.88rem;opacity:.85}

#rsvp .btn{margin:8px 0 72px}
.foot{max-width:1100px;margin:0 auto;border-top:1px solid #FBF8F066;padding-top:24px;display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font-size:.82rem;text-align:left}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 24px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
<body>
<header id="hdr">
  <nav class="nav" aria-label="Main">
    <a class="brand" href="#top" data-i18n="site_name"></a>
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false"><i></i></button>
    <div class="menu" id="menu">
      <a class="l" href="#story" data-i18n="nav_story"></a>
      <a class="l" href="#timeline" data-i18n="nav_timeline"></a>
      <a class="l" href="#location" data-i18n="nav_location"></a>
      <a class="l" href="#agenda" data-i18n="nav_agenda"></a>
      <span class="lang"><button type="button" data-lang="en" aria-pressed="true">EN</button> / <button type="button" data-lang="pt" aria-pressed="false">PT</button></span>
      <a class="btn js-rsvp" href="#rsvp" target="_blank" rel="noopener" data-i18n="nav_rsvp"></a>
    </div>
  </nav>
</header>

<main id="top">
  <div class="photo hero-photo" tabindex="0" role="button"><span data-i18n="add_photo"></span></div>
  <section class="green on-color">
    <div class="wrap hero-txt">
      <p class="eyebrow">Ana &amp; Tom · <span data-i18n="hero_date"></span></p>
      <h1 data-i18n="site_name"></h1>
      <p data-i18n="hero_place"></p>
      <a class="btn js-rsvp" href="#rsvp" target="_blank" rel="noopener" data-i18n="nav_rsvp"></a>
    </div>
  </section>

  <section id="story">
    <div class="wrap">
      <div class="pair">
        <div class="photo" tabindex="0" role="button"><span data-i18n="add_photo"></span></div>
        <div class="photo" tabindex="0" role="button"><span data-i18n="add_photo"></span></div>
      </div>
      <div class="narrow">
        <h2 data-i18n="story_title"></h2>
        <p data-i18n="story_p1"></p><p data-i18n="story_p2"></p>
      </div>
    </div>
  </section>

  <section id="timeline" class="pink">
    <div class="wrap">
      <h2 data-i18n="tl_title"></h2>
      <p data-i18n="tl_lead"></p>
      <ol class="tl">
        <li><div class="yr">2021</div><h3 data-i18n="t1_t"></h3><p data-i18n="t1_d"></p></li>
        <li><div class="yr">2022</div><h3 data-i18n="t2_t"></h3><p data-i18n="t2_d"></p></li>
        <li><div class="yr">2023</div><h3 data-i18n="t3_t"></h3><p data-i18n="t3_d"></p></li>
        <li><div class="yr">2024</div><h3 data-i18n="t4_t"></h3><p data-i18n="t4_d"></p></li>
        <li><div class="yr">2025</div><h3 data-i18n="t5_t"></h3><p data-i18n="t5_d"></p></li>
        <li><div class="yr">2026</div><h3 data-i18n="t6_t"></h3><p data-i18n="t6_d"></p></li>
        <li><div class="yr">2027</div><h3 data-i18n="t7_t"></h3><p data-i18n="t7_d"></p></li>
      </ol>
    </div>
  </section>

  <section id="location">
    <div class="wrap">
      <div class="split">
        <div class="photo" tabindex="0" role="button"><span data-i18n="add_photo"></span></div>
        <div>
          <p class="eyebrow" data-i18n="loc_title"></p>
          <h3 data-i18n="loc_name"></h3>
          <address data-i18n="loc_addr"></address>
          <p data-i18n="loc_text"></p>
          <a class="btn" href="https://www.google.com/maps/search/?api=1&query=Quinta+do+Vale+Douro" target="_blank" rel="noopener" data-i18n="loc_btn"></a>
        </div>
      </div>
      <div class="info">
        <div><h3 data-i18n="dress_t"></h3><p data-i18n="dress_d"></p></div>
        <div><h3 data-i18n="get_t"></h3><ul><li data-i18n="g1"></li><li data-i18n="g2"></li><li data-i18n="g3"></li></ul></div>
        <div><h3 data-i18n="stay_t"></h3><p data-i18n="stay_d"></p></div>
      </div>
    </div>
  </section>

  <section id="agenda" class="green">
    <div class="wrap">
      <h2 data-i18n="agenda_title"></h2>
      <p data-i18n="hero_date"></p>
      <ul class="agenda">
        <li><time>15:00</time><div><strong data-i18n="a1"></strong><span data-i18n="a1d"></span></div></li>
        <li><time>16:00</time><div><strong data-i18n="a2"></strong><span data-i18n="a2d"></span></div></li>
        <li><time>18:30</time><div><strong data-i18n="a3"></strong><span data-i18n="a3d"></span></div></li>
        <li><time>21:00</time><div><strong data-i18n="a4"></strong><span data-i18n="a4d"></span></div></li>
        <li><time>22:00</time><div><strong data-i18n="a5"></strong><span data-i18n="a5d"></span></div></li>
      </ul>
    </div>
  </section>

  <section id="rsvp" class="wine">
    <div class="wrap">
      <div class="narrow">
        <h2 data-i18n="rsvp_title"></h2>
        <p data-i18n="rsvp_lead"></p>
        <a class="btn js-rsvp" href="#rsvp" target="_blank" rel="noopener" data-i18n="rsvp_btn"></a>
      </div>
      <div class="foot">
        <nav><a href="#story" data-i18n="nav_story"></a><a href="#timeline" data-i18n="nav_timeline"></a><a href="#location" data-i18n="nav_location"></a><a href="#agenda" data-i18n="nav_agenda"></a></nav>
        <span>© 2027 Ana &amp; Tom</span>
      </div>
    </div>
  </section>
</main>

<script>
var RSVP_URL="https://forms.gle/REPLACE-WITH-YOUR-FORM"; // paste your form link here
document.querySelectorAll(".js-rsvp").forEach(function(a){a.href=RSVP_URL;});
var T={
en:{
 site_name:"Love at first dive",nav_story:"Our story",nav_timeline:"Timeline",nav_location:"Location & info",nav_agenda:"Agenda",nav_rsvp:"RSVP",
 hero_date:"Saturday 18 September 2027",hero_place:"Quinta do Vale, Douro, Portugal",add_photo:"Click to add your photo",
 story_title:"Our story",

 agenda_title:"Agenda",
 a1:"Guests arrive",a1d:"Welcome drinks on the terrace",a2:"Ceremony",a2d:"Under the olive trees",
 a3:"Dinner",a3d:"Long tables in the garden",a4:"First dance",a4d:"Followed by speeches and cake",a5:"Party",a5d:"Dancing until late",
 rsvp_title:"RSVP",rsvp_lead:"Please reply by 1 July 2027. The form also asks about dietary needs, travel and accommodation.",rsvp_btn:"Open the RSVP form"
},
pt:{
 site_name:"Amor ao primeiro mergulho",nav_story:"A nossa história",nav_timeline:"Cronologia",nav_location:"Local e informações",nav_agenda:"Programa",nav_rsvp:"Confirmar presença",
 hero_date:"Sábado, 18 de setembro de 2027",hero_place:"Quinta do Vale, Douro, Portugal",add_photo:"Clica para adicionar a tua foto",
 story_title:"A nossa história",
 story_p1:"Escrevam aqui algumas linhas sobre como se conheceram. Duas pessoas de lados opostos do mundo, um mergulho e uma conversa muito longa.",
 story_p2:"Acrescentem um ou dois pormenores divertidos. Os convidados adoram saber quem disse olá primeiro.",
 tl_title:"A nossa cronologia",tl_lead:"Do nosso primeiro mergulho em 2021 ao grande dia em 2027.",
 t1_t:"O primeiro mergulho",t1_d:"Onde e como nos conhecemos. Substituam pela vossa história.",
 t2_t:"A nossa primeira viagem",t2_d:"Uma linha sobre a primeira aventura que partilharam.",

}};
var lang="en";
try{var s=localStorage.getItem("lang");if(s==="pt"||s==="en")lang=s;else if((navigator.language||"").toLowerCase().indexOf("pt")===0)lang="pt";}catch(e){}
function apply(l){
  lang=l;document.documentElement.lang=l==="pt"?"pt-PT":"en-NZ";document.title=T[l].site_name;
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=T[l][el.dataset.i18n]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===l);});
  try{localStorage.setItem("lang",l);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){apply(b.dataset.lang);});});
apply(lang);

var hdr=document.getElementById("hdr"),bg=document.getElementById("burger");
bg.addEventListener("click",function(){var o=hdr.classList.toggle("open");bg.setAttribute("aria-expanded",o);});
document.querySelectorAll("#menu a").forEach(function(a){a.addEventListener("click",function(){hdr.classList.remove("open");bg.setAttribute("aria-expanded","false");});});

var picker=document.createElement("input");picker.type="file";picker.accept="image/*";var target=null;
picker.addEventListener("change",function(){
  var f=picker.files[0];if(!f||!target)return;
  target.style.backgroundImage="url("+URL.createObjectURL(f)+")";target.classList.add("has-img");
});
document.querySelectorAll(".photo").forEach(function(p){
  function open(){target=p;picker.value="";picker.click();}
  p.addEventListener("click",open);
  p.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
});
</script>
</body>
</html>
